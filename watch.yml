name: PortWatch -> ntfy

on:
  schedule:
    - cron: '*/10 * * * *'   # alle 10 Minuten
  workflow_dispatch:          # manuell starten per Button

permissions:
  contents: write

concurrency: watch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node watch.mjs
        env:
          NTFY_TOPIC: portwatch-vi
      - name: Stand speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Stand: $(node -p "require('./state.json').score")%" && git push)